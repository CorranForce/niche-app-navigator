name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c=require('./coverage/coverage-summary.json').total;console.log('| Metric | % |\n| --- | --- |\n| Lines | '+c.lines.pct+' |\n| Statements | '+c.statements.pct+' |\n| Functions | '+c.functions.pct+' |\n| Branches | '+c.branches.pct+' |')" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Download base branch coverage (for trend)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: ${{ github.event.pull_request.base.ref }}
          name_is_regexp: true
          name: coverage-
          path: coverage-base
          if_no_artifact_found: warn

      - name: Normalize base coverage path
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          BASE=$(find coverage-base -name coverage-summary.json | head -n 1 || true)
          if [ -n "$BASE" ]; then
            mkdir -p coverage-base-normalized
            cp "$BASE" coverage-base-normalized/coverage-summary.json
          fi

      - name: Coverage report comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage-base-normalized/coverage-summary.json
          file-coverage-mode: changes
          comment-on: pr

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14


      - name: Upload coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
