name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    name: Staging deploy
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Staging deploy: $url" >> $GITHUB_STEP_SUMMARY

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: staging-deploy
          message: |
            ### Staging deploy ready

            | | |
            | --- | --- |
            | Preview URL | ${{ steps.deploy.outputs.url }} |
            | Commit | `${{ github.event.pull_request.head.sha }}` |

      - name: Smoke tests
        id: smoke
        run: node scripts/smoke-test.mjs "${{ steps.deploy.outputs.url }}"

      - name: Social preview checks (og:image / twitter:image)
        id: ogcheck
        run: node scripts/check-og-images.mjs "${{ steps.deploy.outputs.url }}"


      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*Staging deploy ${{ job.status }}* — ${{ github.repository }} (PR #${{ github.event.pull_request.number }})\nURL: ${{ steps.deploy.outputs.url }}\nSmoke tests: ${{ steps.smoke.outcome }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify by email
        if: always() && env.SMTP_SERVER != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Staging deploy ${{ job.status }} — ${{ github.repository }}"
          to: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Staging deploy ${{ job.status }}
            URL: ${{ steps.deploy.outputs.url }}
            Smoke tests: ${{ steps.smoke.outcome }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
